<body>

<button onclick="speak()">मुझसे बात करो 🎤</button>

function speak() {
 let msg = new SpeechSynthesisUtterance("जी जानू, बताइए क्या करना है?");
 msg.lang = "hi-IN";
 speechSynthesis.speak(msg);
}
