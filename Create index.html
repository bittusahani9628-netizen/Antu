
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antu My Personal AI Jarvis</title>
<style>
body {
  background: #050b18;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 25px;
}
h1 { color: #00eaff; }
.robot {
  font-size: 100px;
  margin: 40px;
}
button {
  background: #00d9ff;
  padding: 15px 25px;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  margin: 10px;
}
#answer {
  color: #00eaff;
  margin-top: 30px;
}
</style>
</head>
<body>

<h1>ANTU MY PERSONAL AI JARVIS</h1>
<p>Welcome to my personal assistant</p>

<div class="robot">🤖</div>

<button onclick="listen()">🎤 Bolo Antu</button>
<button onclick="speak('Namaste! Main Antu hoon.')">Hello Antu</button>

<div id="answer">Namaste! Main Antu hoon.</div>

<script>
function speak(text) {
  document.getElementById("answer").innerText = text;
  let voice = new SpeechSynthesisUtterance(text);
  voice.lang = "hi-IN";
  speechSynthesis.speak(voice);
}

function listen() {
  let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    speak("Chrome browser mein try kijiye.");
    return;
  }
  let rec = new SR();
  rec.lang = "hi-IN";
  rec.onresult = function(e) {
    speak("Aapne kaha: " + e.results[0][0].transcript);
  };
  rec.start();
}
</script>

</body>
</html>
