<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antu</title>
    <style>
      :root {
        --bg: #0b1020;
        --bg-2: #131c32;
        --card: rgba(19, 28, 50, 0.88);
        --primary: #7dd3fc;
        --secondary: #a78bfa;
        --accent: #34d399;
        --text: #ebf3ff;
        --muted: #b7c4d8;
        --line: rgba(255, 255, 255, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #172554 0%, var(--bg) 38%, #070d18 100%);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 30px;
      }

      .card {
        width: min(1000px, 100%);
        padding: 56px 42px;
        border-radius: 24px;
        background: rgba(17, 24, 39, 0.72);
        border: 1px solid var(--line);
        box-shadow: 0 25px 80px rgba(3, 7, 18, 0.7);
        backdrop-filter: blur(10px);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--primary);
        background: rgba(125, 211, 252, 0.08);
        border: 1px solid rgba(125, 211, 252, 0.25);
      }

      h1 {
        margin: 22px 0 18px;
        font-size: clamp(2.7rem, 6vw, 5rem);
        line-height: 0.98;
        letter-spacing: -0.06em;
      }

      .highlight {
        color: var(--primary);
      }

      p {
        margin: 0;
        max-width: 720px;
        font-size: 1.12rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 30px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 22px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: #08111d;
        box-shadow: 0 15px 35px rgba(125, 211, 252, 0.35);
      }

      .btn-secondary {
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: var(--text);
        background: rgba(255, 255, 255, 0.02);
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 36px;
      }

      .stat {
        min-width: 120px;
      }

      .stat strong {
        display: block;
        font-size: 1.6rem;
        color: var(--text);
      }

      .stat span {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      @media (max-width: 600px) {
        .card {
          padding: 36px 22px;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="pill">Antu</div>
      <h1>Build your <span class="highlight">next big idea</span>.</h1>
      <p>
        Antu is designed to help you launch faster, present cleaner, and grow smarter. This beautiful
        homepage gives your project a strong first impression and a polished digital presence.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="#">Get Started</a>
        <a class="btn btn-secondary" href="#">View Demo</a>
      </div>

      <div class="stats">
        <div class="stat">
          <strong>24/7</strong>
          <span>Support</span>
        </div>
        <div class="stat">
          <strong>10x</strong>
          <span>Faster Launch</span>
        </div>
        <div class="stat">
          <strong>100%</strong>
          <span>Modern Design</span>
        </div>
      </div>
    </main>
  </body>
</html>
